# Missatges del backend en castellà.
#
# Una clau per missatge, com els fitxers lang/Language_xx.properties del
# frontend, i els valors com a {nom}. Es llegeix en UTF-8: els accents i els
# apòstrofs s'escriuen tal qual. MessagesTest comprova que els quatre fitxers
# tenen les mateixes claus i els mateixos {valors}.

# ---- No existeix ----
not-found.account = No existe la cuenta {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.debt = No existe la deuda {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.transaction = No existe el movimiento {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.recurring = No existe el movimiento recurrente {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.budget = No existe el presupuesto {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.goal = No existe la meta {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.category = No existe la categoría {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.rule = No existe la regla {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
not-found.transfer = No existe la transferencia {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.

# ---- Mesos de l'anàlisi ----
months.reversed = El primer mes ({from}) es posterior al último ({to}).
months.too-many-to-compare = Como mucho se pueden comparar {max} meses, y se han pedido {requested}.
months.too-many-to-show = Como mucho se pueden mirar {max} meses, y se han pedido {requested}.

# ---- Pressupost ----
budgets.apply-no-month = Falta el mes al que aplicar los cambios.
budgets.apply-no-changes = No hay ningún cambio que aplicar.
budgets.amount-or-percent = Cada cambio lleva un importe o un porcentaje, y solo uno.
budgets.negative-plan = Un importe de plan no puede ser negativo.
budgets.percent-range = Un porcentaje tiene que estar entre 0 y 100.

# ---- Categories ----
categories.own-group = Una categoría no puede ser su propio grupo.
categories.group-missing = El grupo elegido no existe: {id}.
categories.group-inside-itself = No se puede poner una subcategoría como grupo de su propia categoría.
categories.delete-has-transactions.one = No se puede eliminar la categoría: tiene {count} movimiento asociado.
categories.delete-has-transactions.other = No se puede eliminar la categoría: tiene {count} movimientos asociados.
categories.delete-has-children = No se puede eliminar la categoría: tiene subcategorías. Muévelas o elimínalas antes.

# ---- Comú ----
common.amount-positive = El importe tiene que ser mayor que cero.
common.category-gone = La categoría elegida ya no existe.
common.category-is-group = La categoría «{name}» es un grupo: elige una concreta.

# ---- Moviments dividits ----
split.at-least-two = Para dividirlo hacen falta al menos dos partes. Para cambiar su categoría, edita el movimiento.
split.positive-amount = Cada parte tiene que tener un importe mayor que cero.
split.two-decimals = Los importes de las partes llevan como mucho dos decimales.
split.category-missing = Cada parte tiene que tener una categoría.
split.total-short = Las partes suman {parts} € y el movimiento es de {total} €: faltan {difference} €.
split.total-over = Las partes suman {parts} € y el movimiento es de {total} €: sobran {difference} €.
shared.part-mine = Mi parte
shared.part-owed = Lo que me deben
shared.payment-split = {row}: el pago ya está dividido. Quita la división antes de compartirlo.
shared.payment-not-expense = {row}: un gasto compartido empieza por un pago, y este movimiento es un ingreso.
shared.payment-transfer = {row}: un traspaso entre tus cuentas no se puede compartir.
shared.payment-has-debt = {row}: el pago ya pertenece a una deuda. Desvincúlalo antes de compartirlo.
shared.repayment-not-income = {row}: solo un ingreso puede devolver un gasto compartido.
shared.repayment-transfer = {row}: es un traspaso entre tus cuentas, no un cobro.
shared.repayment-split = {row}: está dividido. Quita la división para usarlo como cobro.
shared.repayment-has-debt = {row}: ya devuelve otra deuda.
shared.repaid-too-much = Los cobros suman {repaid} € y solo te deben {owed} €.
shared.share-out-of-range = Tu parte tiene que ser de 0 a menos de {total} €: si fuera todo tuyo, no habría nada que compartir.
shared.import-key = {row}: el gasto compartido no tiene clave o repite la de otra fila.
shared.import-payment-missing = {row}: devuelve un gasto compartido cuyo pago no se importa. Marca el pago o quítale el cobro.

# ---- Deutes ----
debts.gone = La deuda elegida ya no existe.
debts.remove-only-installments = Solo se pueden quitar recibos de una deuda a plazos.
debts.receipt-missing = Falta qué recibo.
debts.receipt-not-in-schedule = Este recibo no está en el calendario.
debts.receipt-has-payments = Hay pagos que pagan precisamente este recibo. Desde Movimientos, cámbialos de recibo antes de quitarlo.
debts.receipt-not-removed = Este recibo no está quitado del calendario.
debts.name-missing = Ponle un nombre: a quién o para qué.
debts.direction-missing = Di si la debes tú o te la deben.
debts.date-missing = Falta la fecha del préstamo.
debts.plan-invalid = La forma de devolución tiene que ser libre, de una vez o a plazos.
debts.installment-positive = La cuota tiene que ser mayor que cero.
debts.frequency-invalid = La frecuencia tiene que ser semanal, mensual o trimestral.
debts.repayment-day-missing = Falta el día en que se devuelve.
debts.first-installment-missing = Falta el día de la primera cuota.
debts.repay-before-loan = No se puede empezar a devolver antes del préstamo.
debts.too-many-installments = Con esta cuota serían {payments} pagos. Pon una más grande (máximo {max} pagos).

# ---- Comptes ----
accounts.delete-has-transactions.one = No se puede eliminar la cuenta: tiene {count} movimiento asociado.
accounts.delete-has-transactions.other = No se puede eliminar la cuenta: tiene {count} movimientos asociados.
accounts.delete-has-transfers = No se puede eliminar la cuenta: tiene transferencias asociadas.
accounts.adjust-amount-missing = Falta el importe para ajustar el saldo.
accounts.adjust-operation = La operación sobre el saldo tiene que ser ADD o SUBTRACT, no {operation}.

# ---- Comú: camps ----
common.name-missing = Falta el nombre.
common.category-missing = Falta la categoría.
common.amount-not-negative = El importe no puede ser negativo.
common.frequency-unknown = Frecuencia desconocida.

# ---- Costos fixos i recurrents ----
not-found.fixed-cost = No existe el coste fijo {id}. Quizá se ha eliminado desde otra pestaña: recarga la página.
fixed-costs.not-fixed = El recurrente {id} no es un coste fijo.
recurring.type-invalid = El tipo tiene que ser gasto o ingreso.
recurring.next-date-missing = Falta la fecha del próximo cargo.
recurring.category-required = Falta la categoría: sin ella, el recurrente no cuenta en el presupuesto.
recurring.category-is-block = «{name}» es un bloque: elige una de sus subcategorías. Un recurrente en un bloque se contaría dos veces en el presupuesto.
recurring.income-needs-income-category = Un ingreso recurrente tiene que ir a una categoría de ingresos: en «{name}» el presupuesto no lo contaría.
recurring.expense-in-income-category = Un gasto recurrente no puede ir a «{name}»: es una categoría de ingresos, y ahí el presupuesto solo mira lo que entra.

# ---- Traspassos ----
transfers.same-account = Un traspaso tiene que ir a otra cuenta: «{name}» es la cuenta del mismo movimiento.
transfers.join-needs-both-types = Un traspaso sale de una cuenta y entra en otra: hace falta un gasto y un ingreso.
transfers.join-same-account = Los dos movimientos tienen que ser de cuentas diferentes.
transfers.join-different-amounts = Los dos movimientos no son del mismo importe.
transfers.join-already-transfer = Uno de los dos ya es un traspaso.
transfers.join-has-debt = Uno de los dos está vinculado a una deuda: desvincúlalo antes.
transfers.join-split = Uno de los dos está dividido en partes: quita la división antes.

# ---- Configuració ----
settings.language-invalid = El idioma «{language}» no existe. Tiene que ser ca, es, pt o en.

# ---- Importar extractes ----
upload.format-classic = clásico
upload.format-revolut = Revolut
upload.format-trade-republic = Trade Republic
upload.empty-file = El fichero está vacío, o la primera línea no es la cabecera de las columnas.
upload.unrecognised = No reconozco este extracto: para leerlo como {format} le falta la columna {columns}. Sé leer el clásico (Fecha;Concepto;Importe), Revolut y Trade Republic. Las columnas del fichero son: {present}.
upload.unreadable = No se puede leer el extracto: {reason}. Sé leer el clásico (Fecha;Concepto;Importe), Revolut y Trade Republic.
upload.unreadable-at-line = No se puede leer el extracto en la línea {line}: {reason}. Sé leer el clásico (Fecha;Concepto;Importe), Revolut y Trade Republic.
upload.csv-wrong-delimiter = después de un campo entre comillas hay un carácter que no es el separador «{delimiter}». Suele querer decir que el fichero separa las columnas con otro carácter
upload.csv-unclosed-quote = unas comillas se abren y no se cierran hasta el final del fichero
upload.csv-invalid = el fichero no tiene un formato CSV válido
upload.delimiter-semicolon = punto y coma
upload.delimiter-comma = coma
upload.delimiter-tab = tabulador
upload.line-error = Línea {line} del extracto ({format}): {reason}
upload.date-missing = falta la fecha.
upload.pattern-day-month-year = DD/MM/AAAA
upload.pattern-year-month-day = AAAA-MM-DD
upload.date-unreadable-expected = Fecha ilegible en el CSV: "{value}" (se esperaba {expected}).
upload.date-unreadable = Fecha ilegible en el CSV: "{value}".
upload.amount-unreadable = Importe ilegible en el CSV: "{value}".
upload.amount-unreadable-column = Importe ilegible en la columna «{column}»: "{value}".

# ---- Errors generals ----
errors.internal = Error interno. El detalle está en el log del backend. Referencia {reference}: búscala con «docker compose logs backend».
errors.unknown-route = El backend no tiene ninguna ruta {method} {path}. Si acabas de actualizar la aplicación, el backend en marcha es el de antes: reconstrúyelo con «docker compose up -d --build backend».
errors.wrong-method = La ruta {path} no acepta {method}. Si acabas de actualizar la aplicación, reconstruye el backend con «docker compose up -d --build backend».
errors.unreadable-body = Los datos enviados no tienen el formato que espera el backend: revisa que las fechas y los importes estén bien escritos.
errors.invalid-parameter = El valor «{value}» no es válido para «{name}».
errors.missing-parameter = Falta el parámetro «{name}».
errors.json-expected = El backend espera JSON en esta ruta.
errors.file-too-large = El fichero es demasiado grande: el máximo son 10 MB.
errors.invalid-request = Petición no válida.
errors.integrity = La base de datos no lo permite: hay datos que dependen de ello o que ya existen. {detail}
errors.unknown = Error desconocido.

# ---- Validacions dels controladors ----
months.invalid = El mes «{value}» no es válido: tiene que ser AAAA-MM, como 2026-10.
months.format = El mes tiene que ser AAAA-MM, como 2026-11.
months.number-range = El mes tiene que estar entre 1 y 12.
accounts.amount-not-number = El importe tiene que ser un número.
transfers.accounts-required = Hacen falta la cuenta de origen y la de destino.
transfers.accounts-different = La cuenta de origen y la de destino tienen que ser diferentes.
transfers.insufficient-balance = La cuenta de origen no tiene saldo suficiente.
transfers.source-missing = La cuenta de origen no existe.
transfers.destination-missing = La cuenta de destino no existe.
rules.pattern-empty = El patrón no puede estar vacío.
transactions.date-missing = Falta la fecha del movimiento.
transactions.parts-use-split = Las partes de un movimiento se cambian con el botón de dividir, no editándolo.
transactions.split-amount-change = Este movimiento está dividido en partes. Cámbialas para que sumen el nuevo importe, o quita la división antes de cambiarlo.
transactions.split-debt = Este movimiento está dividido en partes: vincula la deuda a la parte que corresponda.
transactions.join-needs-both = Faltan los dos movimientos del traspaso.
transactions.date-range-reversed = La fecha «desde» no puede ser posterior a la fecha «hasta».

