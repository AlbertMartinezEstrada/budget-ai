transactions.added = Transaction added.
transactions.updated = Transaction updated.
transactions.joined-note = It was the same money as the transaction of {date} in the account {account}: they have been joined into a single transfer.
transactions.deleted = Transaction deleted.
transactions.transfer-joined = Transfer: {from} → {to}. It no longer counts as an expense or as income. The balances do not change.
upload.no-transactions = No transactions found in the CSV.
upload.all-exist = All the transactions in this file already exist in the database.
upload.review = Review the new transactions found ({found}).
upload.processing-failed = Error processing the file: {reason}
upload.all-existed = All the transactions were already in the database.
upload.saved.one = {count} transaction saved.
upload.saved.other = {count} transactions saved.
