upload.saved-skipped.other = {count} transactions saved ({skipped} already existed).
upload.joined.one = {count} transfer was joined with its other leg, which was already there.
upload.joined.other = {count} transfers were joined with their other leg, which was already there.
upload.row = Transaction of {date}, {company}, €{amount}
upload.row-failed = {row}: {reason}
upload.nothing-imported = Nothing was imported. {reason}
accounts.deleted = Account deleted.
budgets.salary-cleared = This month's salary deleted; the default will apply.
budgets.deleted = Budget deleted.
categories.deleted = Category deleted.
debts.deleted = Debt deleted. The transactions stay, unlinked.
goals.deleted = Goal deleted.
