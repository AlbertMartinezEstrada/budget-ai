# Missatges del backend en anglès.
#
# Una clau per missatge, com els fitxers lang/Language_xx.properties del
# frontend, i els valors com a {nom}. Es llegeix en UTF-8: els accents i els
# apòstrofs s'escriuen tal qual. MessagesTest comprova que els quatre fitxers
# tenen les mateixes claus i els mateixos {valors}.

# ---- No existeix ----
not-found.account = Account {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.debt = Debt {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.transaction = Transaction {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.recurring = Recurring transaction {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.budget = Budget {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.goal = Goal {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.category = Category {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.rule = Rule {id} does not exist. It may have been deleted in another tab: reload the page.
not-found.transfer = Transfer {id} does not exist. It may have been deleted in another tab: reload the page.

# ---- Mesos de l'anàlisi ----
months.reversed = The first month ({from}) is after the last one ({to}).
months.too-many-to-compare = At most {max} months can be compared, and {requested} were requested.
months.too-many-to-show = At most {max} months can be shown, and {requested} were requested.

# ---- Pressupost ----
budgets.apply-no-month = The month to apply the changes to is missing.
budgets.apply-no-changes = There are no changes to apply.
budgets.amount-or-percent = Each change carries an amount or a percentage, and only one.
budgets.negative-plan = A planned amount cannot be negative.
budgets.percent-range = A percentage must be between 0 and 100.

# ---- Categories ----
categories.own-group = A category cannot be its own group.
categories.group-missing = The chosen group does not exist: {id}.
categories.group-inside-itself = A subcategory cannot be the group of its own category.
categories.delete-has-transactions.one = The category cannot be deleted: it has {count} transaction.
categories.delete-has-transactions.other = The category cannot be deleted: it has {count} transactions.
categories.delete-has-children = The category cannot be deleted: it has subcategories. Move or delete them first.

# ---- Comú ----
common.amount-positive = The amount must be greater than zero.
common.category-gone = The chosen category no longer exists.
common.category-is-group = The category “{name}” is a group: choose a specific one.

# ---- Moviments dividits ----
split.at-least-two = Splitting it needs at least two parts. To change its category, edit the transaction.
split.positive-amount = Each part needs an amount greater than zero.
split.two-decimals = Part amounts can have at most two decimal places.
split.category-missing = Each part needs a category.
split.total-short = The parts add up to €{parts} and the transaction is €{total}: €{difference} short.
split.total-over = The parts add up to €{parts} and the transaction is €{total}: €{difference} too much.

# ---- Deutes ----
debts.gone = The chosen debt no longer exists.
debts.remove-only-installments = Instalments can only be removed from a debt paid in instalments.
debts.receipt-missing = Which instalment is missing.
debts.receipt-not-in-schedule = This instalment is not in the schedule.
debts.receipt-has-payments = Some payments pay exactly this instalment. In Transactions, move them to another instalment before removing it.
debts.receipt-not-removed = This instalment has not been removed from the schedule.
debts.name-missing = Give it a name: who it is with or what it is for.
debts.direction-missing = Say whether you owe it or are owed it.
debts.date-missing = The loan date is missing.
debts.plan-invalid = The repayment plan must be free, all at once or in instalments.
debts.installment-positive = The instalment must be greater than zero.
debts.frequency-invalid = The frequency must be weekly, monthly or quarterly.
debts.repayment-day-missing = The repayment day is missing.
debts.first-installment-missing = The date of the first instalment is missing.
debts.repay-before-loan = Repayment cannot start before the loan.
debts.too-many-installments = With this instalment it would take {payments} payments. Choose a larger one (at most {max} payments).

# ---- Comptes ----
accounts.delete-has-transactions.one = The account cannot be deleted: it has {count} transaction.
accounts.delete-has-transactions.other = The account cannot be deleted: it has {count} transactions.
accounts.delete-has-transfers = The account cannot be deleted: it has transfers.
accounts.adjust-amount-missing = The amount to adjust the balance by is missing.
accounts.adjust-operation = The balance operation must be ADD or SUBTRACT, not {operation}.

# ---- Comú: camps ----
common.name-missing = The name is missing.
common.category-missing = The category is missing.
common.amount-not-negative = The amount cannot be negative.
common.frequency-unknown = Unknown frequency.

# ---- Costos fixos i recurrents ----
not-found.fixed-cost = Fixed cost {id} does not exist. It may have been deleted in another tab: reload the page.
fixed-costs.not-fixed = Recurring item {id} is not a fixed cost.
recurring.type-invalid = The type must be expense or income.
recurring.next-date-missing = The date of the next charge is missing.
recurring.category-required = The category is missing: without it, the recurring item does not count in the budget.
recurring.category-is-block = “{name}” is a block: choose one of its subcategories. A recurring item in a block would be counted twice in the budget.
recurring.income-needs-income-category = A recurring income must go in an income category: in “{name}” the budget would not count it.
recurring.expense-in-income-category = A recurring expense cannot go in “{name}”: it is an income category, and there the budget only looks at money coming in.

# ---- Traspassos ----
transfers.same-account = A transfer must go to another account: “{name}” is the transaction's own account.
transfers.join-needs-both-types = A transfer leaves one account and enters another: it needs an expense and an income.
transfers.join-same-account = The two transactions must be from different accounts.
transfers.join-different-amounts = The two transactions do not have the same amount.
transfers.join-already-transfer = One of the two is already a transfer.
transfers.join-has-debt = One of the two is linked to a debt: unlink it first.
transfers.join-split = One of the two is split into parts: remove the split first.

# ---- Configuració ----
settings.language-invalid = The language “{language}” does not exist. It must be ca, es, pt or en.

# ---- Importar extractes ----
upload.format-classic = classic
upload.format-revolut = Revolut
upload.format-trade-republic = Trade Republic
upload.empty-file = The file is empty, or the first line is not the column header.
upload.unrecognised = I do not recognise this statement: to read it as {format} it needs the column {columns}. I can read the classic one (Fecha;Concepto;Importe), Revolut and Trade Republic. The file's columns are: {present}.
upload.unreadable = The statement cannot be read: {reason}. I can read the classic one (Fecha;Concepto;Importe), Revolut and Trade Republic.
upload.unreadable-at-line = The statement cannot be read at line {line}: {reason}. I can read the classic one (Fecha;Concepto;Importe), Revolut and Trade Republic.
upload.csv-wrong-delimiter = after a quoted field there is a character that is not the separator “{delimiter}”. It usually means the file separates its columns with another character
upload.csv-unclosed-quote = a quotation mark opens and is not closed until the end of the file
upload.csv-invalid = the file is not valid CSV
upload.delimiter-semicolon = semicolon
upload.delimiter-comma = comma
upload.delimiter-tab = tab
upload.line-error = Line {line} of the statement ({format}): {reason}
upload.date-missing = the date is missing.
upload.pattern-day-month-year = DD/MM/YYYY
upload.pattern-year-month-day = YYYY-MM-DD
upload.date-unreadable-expected = Unreadable date in the CSV: "{value}" (expected {expected}).
upload.date-unreadable = Unreadable date in the CSV: "{value}".
upload.amount-unreadable = Unreadable amount in the CSV: "{value}".
upload.amount-unreadable-column = Unreadable amount in the column «{column}»: "{value}".

# ---- Errors generals ----
errors.internal = Internal error. The details are in the backend log. Reference {reference}: look for it with “docker compose logs backend”.
errors.unknown-route = The backend has no route {method} {path}. If you have just updated the app, the running backend is the old one: rebuild it with “docker compose up -d --build backend”.
errors.wrong-method = The route {path} does not accept {method}. If you have just updated the app, rebuild the backend with “docker compose up -d --build backend”.
errors.unreadable-body = The data sent is not in the format the backend expects: check that dates and amounts are written correctly.
errors.invalid-parameter = The value “{value}” is not valid for “{name}”.
errors.missing-parameter = The parameter “{name}” is missing.
errors.json-expected = The backend expects JSON on this route.
errors.file-too-large = The file is too large: the maximum is 10 MB.
errors.invalid-request = Invalid request.
errors.integrity = The database does not allow it: other data depends on it or it already exists. {detail}
errors.unknown = Unknown error.

# ---- Validacions dels controladors ----
months.invalid = The month “{value}” is not valid: it must be YYYY-MM, like 2026-10.
months.format = The month must be YYYY-MM, like 2026-11.
months.number-range = The month must be between 1 and 12.
accounts.amount-not-number = The amount must be a number.
transfers.accounts-required = The source and destination accounts are required.
transfers.accounts-different = The source and destination accounts must be different.
transfers.insufficient-balance = The source account does not have enough balance.
transfers.source-missing = The source account does not exist.
transfers.destination-missing = The destination account does not exist.
rules.pattern-empty = The pattern cannot be empty.
transactions.date-missing = The transaction date is missing.
transactions.parts-use-split = A transaction's parts are changed with the split button, not by editing it.
transactions.split-amount-change = This transaction is split into parts. Change them so they add up to the new amount, or remove the split before changing it.
transactions.split-debt = This transaction is split into parts: link the debt to the right part.
transactions.join-needs-both = The two transactions of the transfer are missing.
transactions.date-range-reversed = The “from” date cannot be after the “to” date.

