months.format = El mes ha de ser AAAA-MM, com 2026-11.
months.number-range = El mes ha de ser entre 1 i 12.
accounts.amount-not-number = L'import ha de ser un número.
transfers.accounts-required = Calen el compte d'origen i el de destí.
transfers.accounts-different = El compte d'origen i el de destí han de ser diferents.
transfers.insufficient-balance = El compte d'origen no té prou saldo.
transfers.source-missing = El compte d'origen no existeix.
transfers.destination-missing = El compte de destí no existeix.
rules.pattern-empty = El patró no pot estar buit.
transactions.date-missing = Falta la data del moviment.
transactions.parts-use-split = Les parts d'un moviment es canvien amb el botó de dividir, no editant-lo.
transactions.split-amount-change = Aquest moviment està dividit en parts. Canvia-les perquè sumin el nou import, o treu la divisió abans de canviar-lo.
transactions.split-debt = Aquest moviment està dividit en parts: vincula el deute a la part que toca.
transactions.join-needs-both = Falten els dos moviments del traspàs.
transactions.date-range-reversed = La data «des de» no pot ser posterior a la data «fins a».

