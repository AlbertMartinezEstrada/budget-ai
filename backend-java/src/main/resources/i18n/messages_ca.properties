# Missatges del backend en català: l'idioma de referència, el que té totes les claus.
#
# Una clau per missatge, com els fitxers lang/Language_xx.properties del
# frontend, i els valors com a {nom}. Es llegeix en UTF-8: els accents i els
# apòstrofs s'escriuen tal qual. MessagesTest comprova que els quatre fitxers
# tenen les mateixes claus i els mateixos {valors}.

# ---- No existeix ----
not-found.account = No existeix el compte {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.debt = No existeix el deute {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.transaction = No existeix el moviment {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.recurring = No existeix el moviment recurrent {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.budget = No existeix el pressupost {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.goal = No existeix l'objectiu {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.category = No existeix la categoria {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.rule = No existeix la regla {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
not-found.transfer = No existeix la transferència {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.

# ---- Mesos de l'anàlisi ----
months.reversed = El primer mes ({from}) és posterior a l'últim ({to}).
months.too-many-to-compare = Com a molt es poden comparar {max} mesos, i se n'han demanat {requested}.
months.too-many-to-show = Com a molt es poden mirar {max} mesos, i se n'han demanat {requested}.

# ---- Pressupost ----
budgets.apply-no-month = Falta el mes al qual aplicar els canvis.
budgets.apply-no-changes = No hi ha cap canvi per aplicar.
budgets.amount-or-percent = Cada canvi porta un import o un percentatge, i només un.
budgets.negative-plan = Un import de pla no pot ser negatiu.
budgets.percent-range = Un percentatge ha de ser entre 0 i 100.

# ---- Categories ----
categories.own-group = Una categoria no pot ser el seu propi grup.
categories.group-missing = El grup triat no existeix: {id}.
categories.group-inside-itself = No es pot posar una subcategoria com a grup de la seva pròpia categoria.
categories.delete-has-transactions.one = No es pot esborrar la categoria: té {count} moviment associat.
categories.delete-has-transactions.other = No es pot esborrar la categoria: té {count} moviments associats.
categories.delete-has-children = No es pot esborrar la categoria: té subcategories. Mou-les o esborra-les abans.

# ---- Comú ----
common.amount-positive = L'import ha de ser més gran que zero.
common.category-gone = La categoria triada ja no existeix.
common.category-is-group = La categoria «{name}» és un grup: tria'n una de concreta.

# ---- Moviments dividits ----
split.at-least-two = Per dividir-lo calen almenys dues parts. Per canviar-ne la categoria, edita el moviment.
split.positive-amount = Cada part ha de tenir un import més gran que zero.
split.two-decimals = Els imports de les parts porten com a molt dos decimals.
split.category-missing = Cada part ha de tenir una categoria.
split.total-short = Les parts sumen {parts} € i el moviment és de {total} €: en falten {difference} €.
split.total-over = Les parts sumen {parts} € i el moviment és de {total} €: en sobren {difference} €.
shared.part-mine = La meva part
shared.part-owed = El que em deuen
shared.payment-split = {row}: el pagament ja està dividit. Treu-ne la divisió abans de compartir-lo.
shared.payment-not-expense = {row}: una despesa compartida comença per un pagament, i aquest moviment és un ingrés.
shared.payment-transfer = {row}: un traspàs entre els teus comptes no es pot compartir.
shared.payment-has-debt = {row}: el pagament ja és d'un deute. Desvincula'l abans de compartir-lo.
shared.repayment-not-income = {row}: només un ingrés pot tornar una despesa compartida.
shared.repayment-transfer = {row}: és un traspàs entre els teus comptes, no un cobrament.
shared.repayment-split = {row}: està dividit. Treu-ne la divisió per fer-lo servir de cobrament.
shared.repayment-has-debt = {row}: ja torna un altre deute.
shared.repaid-too-much = Els cobraments sumen {repaid} € i només et deuen {owed} €.
shared.share-out-of-range = La teva part ha de ser de 0 a menys de {total} €: si fos tot teu, no hi hauria res a compartir.
shared.import-key = {row}: la despesa compartida no té clau o en repeteix una d'una altra fila.
shared.import-payment-missing = {row}: torna una despesa compartida el pagament de la qual no s'importa. Marca el pagament o treu-li el cobrament.

# ---- Deutes ----
debts.gone = El deute triat ja no existeix.
debts.remove-only-installments = Només es poden treure rebuts d'un deute a quotes.
debts.receipt-missing = Falta quin rebut.
debts.receipt-not-in-schedule = Aquest rebut no és al calendari.
debts.receipt-has-payments = Hi ha pagaments que paguen precisament aquest rebut. Des de Moviments, canvia'ls de rebut abans de treure'l.
debts.receipt-not-removed = Aquest rebut no està tret del calendari.
debts.name-missing = Posa-li un nom: a qui o per a què.
debts.direction-missing = Digues si el deus tu o te'l deuen.
debts.date-missing = Falta la data del préstec.
debts.plan-invalid = La forma de retorn ha de ser lliure, tot de cop o a quotes.
debts.installment-positive = La quota ha de ser més gran que zero.
debts.frequency-invalid = La freqüència ha de ser setmanal, mensual o trimestral.
debts.repayment-day-missing = Falta el dia que es torna.
debts.first-installment-missing = Falta el dia de la primera quota.
debts.repay-before-loan = No es pot començar a tornar abans del préstec.
debts.too-many-installments = Amb aquesta quota serien {payments} pagaments. Posa'n una de més gran (màxim {max} pagaments).

# ---- Comptes ----
accounts.delete-has-transactions.one = No es pot esborrar el compte: té {count} moviment associat.
accounts.delete-has-transactions.other = No es pot esborrar el compte: té {count} moviments associats.
accounts.delete-has-transfers = No es pot esborrar el compte: té transferències associades.
accounts.adjust-amount-missing = Falta l'import per ajustar el saldo.
accounts.adjust-operation = L'operació sobre el saldo ha de ser ADD o SUBTRACT, no {operation}.

# ---- Comú: camps ----
common.name-missing = Falta el nom.
common.category-missing = Falta la categoria.
common.amount-not-negative = L'import no pot ser negatiu.
common.frequency-unknown = Freqüència desconeguda.

# ---- Costos fixos i recurrents ----
not-found.fixed-cost = No existeix el cost fix {id}. Potser s'ha esborrat des d'una altra pestanya: recarrega la pàgina.
fixed-costs.not-fixed = El recurrent {id} no és un cost fix.
recurring.type-invalid = El tipus ha de ser despesa o ingrés.
recurring.next-date-missing = Falta la data del proper càrrec.
recurring.category-required = Falta la categoria: sense, el recurrent no compta al pressupost.
recurring.category-is-block = «{name}» és un bloc: tria una de les seves subcategories. Un recurrent en un bloc es comptaria dues vegades al pressupost.
recurring.income-needs-income-category = Un ingrés recurrent ha d'anar a una categoria d'ingressos: a «{name}» el pressupost no el comptaria.
recurring.expense-in-income-category = Una despesa recurrent no pot anar a «{name}»: és una categoria d'ingressos, i allà el pressupost només mira el que entra.

# ---- Traspassos ----
transfers.same-account = Un traspàs ha d'anar a un altre compte: «{name}» és el compte del mateix moviment.
transfers.join-needs-both-types = Un traspàs surt d'un compte i entra a un altre: cal una despesa i un ingrés.
transfers.join-same-account = Els dos moviments han de ser de comptes diferents.
transfers.join-different-amounts = Els dos moviments no són del mateix import.
transfers.join-already-transfer = Un dels dos ja és un traspàs.
transfers.join-has-debt = Un dels dos està vinculat a un deute: desvincula'l abans.
transfers.join-split = Un dels dos està dividit en parts: treu la divisió abans.

# ---- Configuració ----
settings.language-invalid = L'idioma «{language}» no existeix. Ha de ser ca, es, pt o en.

# ---- Importar extractes ----
upload.format-classic = clàssic
upload.format-revolut = Revolut
upload.format-trade-republic = Trade Republic
upload.empty-file = El fitxer és buit, o la primera línia no és la capçalera de les columnes.
upload.unrecognised = No reconec aquest extracte: per llegir-lo com a {format} li falta la columna {columns}. Sé llegir el clàssic (Fecha;Concepto;Importe), Revolut i Trade Republic. Les columnes del fitxer són: {present}.
upload.unreadable = No es pot llegir l'extracte: {reason}. Sé llegir el clàssic (Fecha;Concepto;Importe), Revolut i Trade Republic.
upload.unreadable-at-line = No es pot llegir l'extracte a la línia {line}: {reason}. Sé llegir el clàssic (Fecha;Concepto;Importe), Revolut i Trade Republic.
upload.csv-wrong-delimiter = després d'un camp entre cometes hi ha un caràcter que no és el separador «{delimiter}». Sol voler dir que el fitxer separa les columnes amb un altre caràcter
upload.csv-unclosed-quote = unes cometes s'obren i no es tanquen fins al final del fitxer
upload.csv-invalid = el fitxer no té un format CSV vàlid
upload.delimiter-semicolon = punt i coma
upload.delimiter-comma = coma
upload.delimiter-tab = tabulador
upload.line-error = Línia {line} de l'extracte ({format}): {reason}
upload.date-missing = falta la data.
upload.pattern-day-month-year = DD/MM/AAAA
upload.pattern-year-month-day = AAAA-MM-DD
upload.date-unreadable-expected = Data il·legible al CSV: "{value}" (s'esperava {expected}).
upload.date-unreadable = Data il·legible al CSV: "{value}".
upload.amount-unreadable = Import il·legible al CSV: "{value}".
upload.amount-unreadable-column = Import il·legible a la columna «{column}»: "{value}".

# ---- Errors generals ----
errors.internal = Error intern. El detall és al log del backend. Referència {reference}: busca-la amb «docker compose logs backend».
errors.unknown-route = El backend no té cap ruta {method} {path}. Si acabes d'actualitzar l'aplicació, el backend en marxa és el d'abans: reconstrueix-lo amb «docker compose up -d --build backend».
errors.wrong-method = La ruta {path} no accepta {method}. Si acabes d'actualitzar l'aplicació, reconstrueix el backend amb «docker compose up -d --build backend».
errors.unreadable-body = Les dades enviades no tenen el format que espera el backend: revisa que les dates i els imports estiguin ben escrits.
errors.invalid-parameter = El valor «{value}» no és vàlid per a «{name}».
errors.missing-parameter = Falta el paràmetre «{name}».
errors.json-expected = El backend espera JSON en aquesta ruta.
errors.file-too-large = El fitxer és massa gran: el màxim són 10 MB.
errors.invalid-request = Petició no vàlida.
errors.integrity = La base de dades no ho permet: hi ha dades que en depenen o que ja existeixen. {detail}
errors.unknown = Error desconegut.

