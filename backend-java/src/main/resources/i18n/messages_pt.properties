transactions.transfer-joined = Transferência: {from} → {to}. Já não conta como despesa nem como receita. Os saldos não mudam.
upload.no-transactions = Não foram encontrados movimentos no CSV.
upload.all-exist = Todos os movimentos deste ficheiro já existem na base de dados.
upload.review = Reveja os movimentos novos encontrados ({found}).
upload.processing-failed = Erro ao processar o ficheiro: {reason}
