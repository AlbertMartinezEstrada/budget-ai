# Missatges del backend en portuguès.
#
# Una clau per missatge, com els fitxers lang/Language_xx.properties del
# frontend, i els valors com a {nom}. Es llegeix en UTF-8: els accents i els
# apòstrofs s'escriuen tal qual. MessagesTest comprova que els quatre fitxers
# tenen les mateixes claus i els mateixos {valors}.

# ---- No existeix ----
not-found.account = A conta {id} não existe. Talvez tenha sido eliminada noutro separador: recarregue a página.
not-found.debt = A dívida {id} não existe. Talvez tenha sido eliminada noutro separador: recarregue a página.
not-found.transaction = O movimento {id} não existe. Talvez tenha sido eliminado noutro separador: recarregue a página.
not-found.recurring = O movimento recorrente {id} não existe. Talvez tenha sido eliminado noutro separador: recarregue a página.
not-found.budget = O orçamento {id} não existe. Talvez tenha sido eliminado noutro separador: recarregue a página.
not-found.goal = O objetivo {id} não existe. Talvez tenha sido eliminado noutro separador: recarregue a página.
not-found.category = A categoria {id} não existe. Talvez tenha sido eliminada noutro separador: recarregue a página.
not-found.rule = A regra {id} não existe. Talvez tenha sido eliminada noutro separador: recarregue a página.
not-found.transfer = A transferência {id} não existe. Talvez tenha sido eliminada noutro separador: recarregue a página.

# ---- Mesos de l'anàlisi ----
months.reversed = O primeiro mês ({from}) é posterior ao último ({to}).
months.too-many-to-compare = No máximo podem comparar-se {max} meses, e foram pedidos {requested}.
months.too-many-to-show = No máximo podem ver-se {max} meses, e foram pedidos {requested}.

# ---- Pressupost ----
budgets.apply-no-month = Falta o mês a que aplicar as alterações.
budgets.apply-no-changes = Não há nenhuma alteração para aplicar.
budgets.amount-or-percent = Cada alteração leva um montante ou uma percentagem, e só um.
budgets.negative-plan = Um montante de plano não pode ser negativo.
budgets.percent-range = Uma percentagem tem de estar entre 0 e 100.

# ---- Categories ----
categories.own-group = Uma categoria não pode ser o seu próprio grupo.
categories.group-missing = O grupo escolhido não existe: {id}.
categories.group-inside-itself = Não se pode pôr uma subcategoria como grupo da sua própria categoria.
categories.delete-has-transactions.one = Não se pode eliminar a categoria: tem {count} movimento associado.
categories.delete-has-transactions.other = Não se pode eliminar a categoria: tem {count} movimentos associados.
categories.delete-has-children = Não se pode eliminar a categoria: tem subcategorias. Mova-as ou elimine-as antes.

# ---- Comú ----
common.amount-positive = O montante tem de ser maior que zero.
common.category-gone = A categoria escolhida já não existe.
common.category-is-group = A categoria «{name}» é um grupo: escolha uma concreta.

# ---- Moviments dividits ----
split.at-least-two = Para o dividir são precisas pelo menos duas partes. Para mudar a categoria, edite o movimento.
split.positive-amount = Cada parte tem de ter um montante maior que zero.
split.two-decimals = Os montantes das partes levam no máximo duas casas decimais.
split.category-missing = Cada parte tem de ter uma categoria.
split.total-short = As partes somam {parts} € e o movimento é de {total} €: faltam {difference} €.
split.total-over = As partes somam {parts} € e o movimento é de {total} €: sobram {difference} €.

# ---- Deutes ----
debts.gone = A dívida escolhida já não existe.
debts.remove-only-installments = Só se podem retirar prestações de uma dívida a prestações.
debts.receipt-missing = Falta indicar a prestação.
debts.receipt-not-in-schedule = Esta prestação não está no calendário.
debts.receipt-has-payments = Há pagamentos que pagam precisamente esta prestação. Em Movimentos, mude-os de prestação antes de a retirar.
debts.receipt-not-removed = Esta prestação não foi retirada do calendário.
debts.name-missing = Dê-lhe um nome: a quem ou para quê.
debts.direction-missing = Indique se é você que deve ou se lhe devem.
debts.date-missing = Falta a data do empréstimo.
debts.plan-invalid = A forma de devolução tem de ser livre, de uma vez ou a prestações.
debts.installment-positive = A prestação tem de ser maior que zero.
debts.frequency-invalid = A frequência tem de ser semanal, mensal ou trimestral.
debts.repayment-day-missing = Falta o dia em que se devolve.
debts.first-installment-missing = Falta o dia da primeira prestação.
debts.repay-before-loan = Não se pode começar a devolver antes do empréstimo.
debts.too-many-installments = Com esta prestação seriam {payments} pagamentos. Defina uma maior (máximo {max} pagamentos).

# ---- Comptes ----
accounts.delete-has-transactions.one = Não se pode eliminar a conta: tem {count} movimento associado.
accounts.delete-has-transactions.other = Não se pode eliminar a conta: tem {count} movimentos associados.
accounts.delete-has-transfers = Não se pode eliminar a conta: tem transferências associadas.
accounts.adjust-amount-missing = Falta o montante para ajustar o saldo.
accounts.adjust-operation = A operação sobre o saldo tem de ser ADD ou SUBTRACT, não {operation}.

# ---- Comú: camps ----
common.name-missing = Falta o nome.
common.category-missing = Falta a categoria.
common.amount-not-negative = O montante não pode ser negativo.
common.frequency-unknown = Frequência desconhecida.

# ---- Costos fixos i recurrents ----
not-found.fixed-cost = O custo fixo {id} não existe. Talvez tenha sido eliminado noutro separador: recarregue a página.
fixed-costs.not-fixed = O recorrente {id} não é um custo fixo.
recurring.type-invalid = O tipo tem de ser despesa ou receita.
recurring.next-date-missing = Falta a data do próximo débito.
recurring.category-required = Falta a categoria: sem ela, o recorrente não conta no orçamento.
recurring.category-is-block = «{name}» é um bloco: escolha uma das suas subcategorias. Um recorrente num bloco contaria duas vezes no orçamento.
recurring.income-needs-income-category = Uma receita recorrente tem de ir para uma categoria de receitas: em «{name}» o orçamento não a contaria.
recurring.expense-in-income-category = Uma despesa recorrente não pode ir para «{name}»: é uma categoria de receitas, e aí o orçamento só olha para o que entra.

# ---- Traspassos ----
transfers.same-account = Uma transferência tem de ir para outra conta: «{name}» é a conta do próprio movimento.
transfers.join-needs-both-types = Uma transferência sai de uma conta e entra noutra: são precisas uma despesa e uma receita.
transfers.join-same-account = Os dois movimentos têm de ser de contas diferentes.
transfers.join-different-amounts = Os dois movimentos não têm o mesmo montante.
transfers.join-already-transfer = Um dos dois já é uma transferência.
transfers.join-has-debt = Um dos dois está ligado a uma dívida: desligue-o antes.
transfers.join-split = Um dos dois está dividido em partes: retire a divisão antes.

# ---- Configuració ----
settings.language-invalid = O idioma «{language}» não existe. Tem de ser ca, es, pt ou en.

# ---- Importar extractes ----
upload.format-classic = clássico
upload.format-revolut = Revolut
upload.format-trade-republic = Trade Republic
upload.empty-file = O ficheiro está vazio, ou a primeira linha não é o cabeçalho das colunas.
upload.unrecognised = Não reconheço este extrato: para o ler como {format} falta-lhe a coluna {columns}. Sei ler o clássico (Fecha;Concepto;Importe), o Revolut e o Trade Republic. As colunas do ficheiro são: {present}.
upload.unreadable = Não é possível ler o extrato: {reason}. Sei ler o clássico (Fecha;Concepto;Importe), o Revolut e o Trade Republic.
upload.unreadable-at-line = Não é possível ler o extrato na linha {line}: {reason}. Sei ler o clássico (Fecha;Concepto;Importe), o Revolut e o Trade Republic.
upload.csv-wrong-delimiter = depois de um campo entre aspas há um carácter que não é o separador «{delimiter}». Costuma querer dizer que o ficheiro separa as colunas com outro carácter
upload.csv-unclosed-quote = umas aspas abrem-se e não fecham até ao fim do ficheiro
upload.csv-invalid = o ficheiro não tem um formato CSV válido
upload.delimiter-semicolon = ponto e vírgula
upload.delimiter-comma = vírgula
upload.delimiter-tab = tabulação
upload.line-error = Linha {line} do extrato ({format}): {reason}
upload.date-missing = falta a data.
upload.pattern-day-month-year = DD/MM/AAAA
upload.pattern-year-month-day = AAAA-MM-DD
upload.date-unreadable-expected = Data ilegível no CSV: "{value}" (esperava-se {expected}).
upload.date-unreadable = Data ilegível no CSV: "{value}".
upload.amount-unreadable = Montante ilegível no CSV: "{value}".
upload.amount-unreadable-column = Montante ilegível na coluna «{column}»: "{value}".

# ---- Errors generals ----
errors.internal = Erro interno. O detalhe está no log do backend. Referência {reference}: procure-a com «docker compose logs backend».
errors.unknown-route = O backend não tem nenhuma rota {method} {path}. Se acabou de atualizar a aplicação, o backend em execução é o anterior: reconstrua-o com «docker compose up -d --build backend».
errors.wrong-method = A rota {path} não aceita {method}. Se acabou de atualizar a aplicação, reconstrua o backend com «docker compose up -d --build backend».
errors.unreadable-body = Os dados enviados não têm o formato que o backend espera: verifique se as datas e os montantes estão bem escritos.
errors.invalid-parameter = O valor «{value}» não é válido para «{name}».
errors.missing-parameter = Falta o parâmetro «{name}».
errors.json-expected = O backend espera JSON nesta rota.
errors.file-too-large = O ficheiro é demasiado grande: o máximo são 10 MB.
errors.invalid-request = Pedido inválido.
errors.integrity = A base de dados não o permite: há dados que dependem disso ou que já existem. {detail}
errors.unknown = Erro desconhecido.

# ---- Validacions dels controladors ----
months.invalid = O mês «{value}» não é válido: tem de ser AAAA-MM, como 2026-10.
months.format = O mês tem de ser AAAA-MM, como 2026-11.
months.number-range = O mês tem de estar entre 1 e 12.
accounts.amount-not-number = O montante tem de ser um número.
transfers.accounts-required = São precisas a conta de origem e a de destino.
transfers.accounts-different = A conta de origem e a de destino têm de ser diferentes.
transfers.insufficient-balance = A conta de origem não tem saldo suficiente.
transfers.source-missing = A conta de origem não existe.
transfers.destination-missing = A conta de destino não existe.
rules.pattern-empty = O padrão não pode estar vazio.
transactions.date-missing = Falta a data do movimento.
transactions.parts-use-split = As partes de um movimento mudam-se com o botão de dividir, não editando-o.
transactions.split-amount-change = Este movimento está dividido em partes. Altere-as para que somem o novo montante, ou retire a divisão antes de o alterar.
transactions.split-debt = Este movimento está dividido em partes: ligue a dívida à parte certa.
transactions.join-needs-both = Faltam os dois movimentos da transferência.
transactions.date-range-reversed = A data «de» não pode ser posterior à data «até».

