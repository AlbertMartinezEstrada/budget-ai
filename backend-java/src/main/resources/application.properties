spring.application.name=budget-ai-backend
server.port=8000

# Database configuration (matches docker-compose.yml)
# Sense valors per defecte a propòsit: les credencials han de venir de
# l'entorn (fitxer .env), no del codi. Abans hi havia un usuari i una
# contrasenya reals escrits aquí i pujats al repositori.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini API Key (loaded from env)
# Amb valor per defecte buit perquè l'aplicació arrenqui encara que no hi
# hagi clau: sense això, faltar la variable impedia iniciar tot el backend
# i no només la classificació automàtica.
gemini.api.key=${GEMINI_API_KEY:}

# Orígens permesos per CORS. Abans cada controller tenia origins="*".
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Autenticació. Sense valors per defecte a propòsit: si falten, l'aplicació
# no arrenca, que és millor que quedar-se oberta sense que ningú se n'adoni.
app.auth.username=${AUTH_USERNAME:}
app.auth.password=${AUTH_PASSWORD:}
app.auth.password-hash=${AUTH_PASSWORD_HASH:}
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.session-duration=${AUTH_SESSION_DURATION:P7D}
app.auth.max-login-attempts=${AUTH_MAX_LOGIN_ATTEMPTS:5}
app.auth.login-lock-duration=${AUTH_LOGIN_LOCK_DURATION:PT1M}
# Marcar la cookie com a Secure requereix HTTPS; en local es serveix per HTTP.
app.auth.secure-cookie=${AUTH_SECURE_COOKIE:false}
