plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.budgetai'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

// sourceCompatibility només mira la sintaxi: amb un JDK més nou en local, el
// codi podia fer servir mètodes que a Java 17 no existeixen (Duration.isPositive
// és de la 18), compilava a casa i petava al CI i a la imatge de Docker.
// --release 17 compila contra l'API de la 17.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.apache.commons:commons-csv:1.14.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Lombok també al codi de test: sense això, els tests que construeixen
    // entitats no veuen els getters i setters generats.
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // Les versions les gestiona el BOM de Spring Boot.
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.springframework.security:spring-security-test'
}

// Els tests unitaris no necessiten Docker ni base de dades: han de poder
// executar-se sempre i de pressa, per exemple abans de cada commit.
// Només el jar executable. Spring Boot en generava també un "-plain", sense
// dependències ni arrencada, i el Dockerfile copia "*.jar" a app.jar: s'hi
// quedava el bo només perquè, en ordre alfabètic, era l'últim a copiar-se.
tasks.named('jar') {
    enabled = false
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
    // DockerComposeEnvironmentTest el llegeix: sense declarar-lo, canviar-lo
    // no tornava a executar els tests (Gradle els donava per fets).
    inputs.file('../docker-compose.yml').withPathSensitivity(PathSensitivity.RELATIVE)
}

/**
 * Versió de l'API de Docker que exigeix el dimoni, si demana més de la que el
 * client fa servir per defecte. Null si no cal fer res.
 *
 * docker-java demana la 1.43 i no la negocia. Els Docker Desktop recents
 * responen 400 a qualsevol versió per sota de la seva MinAPIVersion, i llavors
 * Testcontainers conclou que no hi ha cap entorn de Docker vàlid: fallen els
 * tests d'integració sencers abans d'executar ni una línia del projecte.
 *
 * Es pregunta al dimoni en comptes de fixar un número perquè imposar-ne un
 * trencaria a l'inrevés: en una màquina amb Docker antic, exigir una versió
 * que no arriba a suportar. Així només s'intervé quan el client es queda curt,
 * i allà on ja funciona —el CI— no canvia res.
 */
static String dockerApiVersionFloor() {
    try {
        Process process = new ProcessBuilder('docker', 'version', '--format', '{{.Server.MinAPIVersion}}')
                .redirectErrorStream(true).start()
        if (!process.waitFor(10, java.util.concurrent.TimeUnit.SECONDS) || process.exitValue() != 0) {
            return null
        }

        String minimum = process.inputStream.text.trim()
        if (!(minimum ==~ /\d+\.\d+/)) return null

        // Comparació numèrica: "1.9" no és més gran que "1.43" en text.
        def asNumbers = { String v -> v.tokenize('.').collect { it as int } }
        def required = asNumbers(minimum)
        def clientDefault = [1, 43]

        return (required[0] <=> clientDefault[0] ?: required[1] <=> clientDefault[1]) > 0 ? minimum : null
    } catch (Exception ignored) {
        // Sense Docker no hi ha res a ajustar: els tests ja fallaran sols i
        // amb un missatge més clar que el que podríem donar aquí.
        return null
    }
}

// Els d'integració aixequen un PostgreSQL de debò amb Testcontainers, així
// que requereixen Docker en marxa.
tasks.register('integrationTest', Test) {
    description = 'Executa els tests d\'integració (requereix Docker)'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.named('test')

    // Els tests construeixen la base de dades amb aquests fitxers. Sense
    // declarar-los, canviar init.sql o una migració no tornava a executar els
    // tests d'integració: Gradle reaprofitava el resultat anterior.
    inputs.file('init.sql').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.dir('migrations').withPathSensitivity(PathSensitivity.RELATIVE)

    // A doFirst i no a la configuració: així només es crida Docker quan els
    // tests s'executen de debò, no cada vegada que Gradle llegeix el fitxer.
    doFirst {
        String floor = dockerApiVersionFloor()
        if (floor != null) {
            systemProperty 'api.version', floor
            logger.lifecycle("Docker exigeix com a mínim l'API $floor; s'hi ajusta el client.")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}
