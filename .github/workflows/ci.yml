name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permet llançar-lo a mà des de la pestanya Actions.
  workflow_dispatch:

# Si es puja un canvi nou a la mateixa branca, s'atura l'execució anterior:
# no té sentit gastar minuts validant codi que ja ha quedat enrere.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend · tests unitaris
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Executar els tests unitaris
        working-directory: backend-java
        run: ./gradlew test --no-daemon

      # El jar per a la prova de navegador. Es fa aquí, que té la memòria cau
      # de Gradle: compilar des de zero vol baixar-ho tot de Maven Central, que
      # sovint respon 429 (massa peticions) a les màquines de GitHub.
      - name: Empaquetar el backend
        working-directory: backend-java
        run: ./gradlew assemble --no-daemon

      - name: Guardar el jar per a la prova de navegador
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend-java/build/libs/*.jar
          retention-days: 1

      - name: Publicar l'informe si han fallat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests-unitaris
          path: backend-java/build/reports/tests/test/
          retention-days: 7

  backend-integration:
    name: Backend · tests d'integració
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      # Els runners d'ubuntu porten Docker, que és el que necessita
      # Testcontainers per aixecar el PostgreSQL de debò.
      - name: Executar els tests d'integració
        working-directory: backend-java
        run: ./gradlew integrationTest --no-daemon

      - name: Publicar l'informe si han fallat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: informe-tests-integracio
          path: backend-java/build/reports/tests/integrationTest/
          retention-days: 7

  frontend:
    name: Frontend · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La mateixa versió que fa servir el contenidor. El script de tests ja
      # es va haver de corregir un cop perquè no era portable entre versions
      # de Node, així que val la pena que la integració contínua fixi la del
      # contenidor i el desenvolupament faci servir la de la màquina.
      - name: Preparar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instal·lar dependències
        working-directory: frontend
        run: npm ci

      - name: Executar els tests
        working-directory: frontend
        run: npm test

      # Només les dependències que corren al servidor (express i les seves).
      # Les de Tailwind només generen el CSS i no són a la imatge. Si en surt
      # una de greu, el CI ho diu en lloc d'esperar que algú ho miri.
      - name: Revisar vulnerabilitats de les dependències de producció
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  # L'aplicació sencera en un navegador, contra una base de dades nova: entrar,
  # importar l'extracte d'exemple i recórrer totes les vistes i formularis en
  # clar i en fosc (frontend/e2e/navegador.mjs). Abans això només es feia a mà.
  browser:
    name: Navegador · totes les vistes
    runs-on: ubuntu-latest
    # Fa servir el jar que empaqueta el job dels unitaris: aquí no es compila.
    needs: backend-unit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 2s --health-timeout 5s --health-retries 30
    # Credencials d'aquesta base de dades de prova, que només existeix durant el job.
    env:
      DB_HOST: localhost
      DB_NAME: budget
      DB_USER: budget
      DB_PASSWORD: budget
      AUTH_USERNAME: prova
      AUTH_PASSWORD: contrasenya-de-prova-del-ci
      JWT_SECRET: clau-de-prova-del-ci-prou-llarga-per-a-hmac-sha256
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Baixar el jar del backend
        uses: actions/download-artifact@v8
        with:
          name: backend-jar
          path: backend-java/build/libs

      - name: Crear l'esquema amb init.sql
        env:
          PGPASSWORD: budget
        run: psql -h localhost -U budget -d budget -v ON_ERROR_STOP=1 -q -f backend-java/init.sql

      - name: Engegar el backend
        working-directory: backend-java
        run: nohup java -jar build/libs/*.jar > backend.log 2>&1 &

      - name: Instal·lar el frontend i Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Engegar el frontend
        working-directory: frontend
        run: nohup node index.js > frontend.log 2>&1 &

      - name: Esperar que responguin
        run: |
          for attempt in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8000/auth/me && curl -fs -o /dev/null http://localhost:3000/ && exit 0
            sleep 2
          done
          echo "No han arrencat:"; tail -40 backend-java/backend.log; exit 1

      - name: Recórrer l'aplicació
        working-directory: frontend
        env:
          E2E_BASE_DE_DADES_DE_PROVA: si
          E2E_USERNAME: prova
          E2E_PASSWORD: contrasenya-de-prova-del-ci
        run: npm run test:navegador

      - name: Publicar captures i registres si ha fallat
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: navegador
          path: |
            frontend/e2e/resultats/
            backend-java/backend.log
            frontend/frontend.log
          retention-days: 7

  # Les dependències de Gradle a GitHub, perquè Dependabot avisi si una té
  # una vulnerabilitat. De build.gradle no les sap llegir sol: les de npm sí,
  # del package-lock.json. A main, que és el que corre de debò, i quan es
  # llança a mà. No a les PR: les de Dependabot no tenen permís d'escriptura.
  dependency-graph:
    name: Dependències del backend a GitHub
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Resol les dependències des de zero (Maven Central, que de vegades respon
    # 429). És informatiu per a Dependabot: si un dia falla, no ha de posar
    # main en vermell, i el següent push ho torna a provar.
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Preparar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Enviar les dependències
        uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: backend-java

  build-images:
    name: Construir les imatges de Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No es publiquen enlloc: només es comprova que els Dockerfile
      # segueixin construint, que és com es desplega l'aplicació.
      - name: Construir el backend
        run: docker build -t budget-ai-backend:ci ./backend-java

      - name: Construir el frontend
        run: docker build -t budget-ai-frontend:ci ./frontend

      # Que construeixin no vol dir que funcionin. El backend copiava dos jars
      # al mateix nom i es quedava el bo per ordre alfabètic.
      - name: Comprovar el backend (un sol jar, sense root)
        run: |
          docker run --rm --entrypoint sh budget-ai-backend:ci -c \
            'test -f app.jar && test "$(id -u)" != 0 && echo "app.jar correcte, usuari $(id -un)"'

      - name: Comprovar el frontend (serveix la pàgina amb les capçaleres, sense root)
        run: |
          docker run -d --name frontend-ci -p 3000:3000 budget-ai-frontend:ci
          for attempt in $(seq 1 20); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          curl -fsI http://localhost:3000/ | tee headers.txt
          grep -qi '^content-security-policy:' headers.txt
          test "$(docker exec frontend-ci id -u)" != 0
          docker rm -f frontend-ci
