# Budget AI · català
#
# És l'idioma de referència: totes les claus són aquí, i i18n.test.js comprova
# que els altres tres fitxers tenen exactament les mateixes. Una clau nova
# s'afegeix als quatre.
#
# Format: clau = text. Els {noms} es substitueixen pel valor que passa la vista.
# Amb {count}, clau.one i clau.other són el singular i el plural. Els textos no
# poden portar < > " & ni ` (es posen tal qual dins de l'HTML): per citar,
# «cometes baixes».

