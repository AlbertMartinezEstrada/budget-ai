<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget AI</title>
    <!-- Sense icona, el navegador demanava /favicon.ico a cada càrrega i rebia un 404. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- CSS. layers.css fixa l'ordre de les capes de Tailwind 4 i hi posa els
         CSS propis (main, layout, components) i les icones: ha d'anar primer. -->
    <link rel="stylesheet" href="css/layers.css">

    <!-- Tot es serveix des de l'aplicació, res des d'un CDN: un script de
         tercers té accés a tota la pàgina, i sense internet l'aplicació es
         quedava sense estils. Es genera amb "npm run build:assets". -->
    <link rel="stylesheet" href="vendor/inter/inter.css">
    <link rel="stylesheet" href="css/tailwind.css">
    <!-- Després de Tailwind: hi tradueix al tema fosc les classes que les
         vistes fan servir sense la variant dark:. -->
    <link rel="stylesheet" href="css/dark.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <span class="material-symbols-outlined" style="font-size: 2rem; color: #818cf8;">account_balance_wallet</span>
                <span class="sidebar-logo">Budget AI</span>
            </div>
            <nav class="nav-links flex-1 px-4 space-y-1">
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="dashboard">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span class="font-medium text-sm" data-i18n="nav.dashboard">Tauler</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="transactions">
                    <span class="material-symbols-outlined">receipt_long</span>
                    <span class="font-medium text-sm" data-i18n="nav.transactions">Moviments</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="categories">
                    <span class="material-symbols-outlined">label</span>
                    <span class="font-medium text-sm" data-i18n="nav.categories">Categories</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="accounts">
                    <span class="material-symbols-outlined">account_balance_wallet</span>
                    <span class="font-medium text-sm" data-i18n="nav.accounts">Comptes</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="budgets">
                    <span class="material-symbols-outlined">pie_chart</span>
                    <span class="font-medium text-sm" data-i18n="nav.budgets">Pressupost</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="goals">
                    <span class="material-symbols-outlined">flag</span>
                    <span class="font-medium text-sm" data-i18n="nav.goals">Objectius</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="debts">
                    <span class="material-symbols-outlined">handshake</span>
                    <span class="font-medium text-sm" data-i18n="nav.debts">Deutes</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="transfers">
                    <span class="material-symbols-outlined">swap_horiz</span>
                    <span class="font-medium text-sm" data-i18n="nav.transfers">Transferències</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="recurring">
                    <span class="material-symbols-outlined">autorenew</span>
                    <span class="font-medium text-sm" data-i18n="nav.recurring">Recurrents</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="analytics">
                    <span class="material-symbols-outlined">insights</span>
                    <span class="font-medium text-sm" data-i18n="nav.analytics">Anàlisi</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-3xl transition-colors" href="#" data-view="settings">
                    <span class="material-symbols-outlined">settings</span>
                    <span class="font-medium text-sm" data-i18n="nav.settings">Configuració</span>
                </a>
            </nav>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar flex justify-between items-center px-6 py-4 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700">
                <h2 class="page-title text-xl font-bold text-slate-800 dark:text-slate-100" id="page-title">Budget AI</h2>

                <div class="flex items-center gap-4">
                    <button class="nav-link flex items-center gap-2 rounded-2xl bg-primary py-2 px-4 text-white text-sm font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all" data-view="upload">
                        <span class="material-symbols-outlined text-lg">upload_file</span>
                        <span data-i18n="nav.upload">Importar CSV</span>
                    </button>

                    <div class="user-profile cursor-pointer">
                        <span class="material-symbols-outlined" style="font-size: 2rem; color: #6b7280;">account_circle</span>
                    </div>

                    <button id="logout-btn" title="Tancar la sessió" data-i18n-title="header.logout-title"
                            class="flex items-center gap-2 rounded-2xl border border-slate-200 dark:border-slate-700 py-2 px-3 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-lg">logout</span>
                        <span data-i18n="header.logout">Sortir</span>
                    </button>
                </div>
            </header>

            <div id="main-content" class="content-area p-6">
                <!-- Dynamic Content Loaded Here -->
                <div class="loading-spinner" data-i18n="common.loading">Carregant…</div>
            </div>
        </main>
    </div>

    <!-- JS Modules -->
    <!-- Chart.js deixa Chart a window. Amb defer s'executa abans que app.js,
         que com a mòdul també espera que s'hagi llegit la pàgina. -->
    <script defer src="vendor/chart.js/chart.umd.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
