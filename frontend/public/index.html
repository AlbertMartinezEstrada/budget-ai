<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget AI - Gestor de Gastos</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Tot es serveix des de l'aplicació, res des d'un CDN: un script de
         tercers té accés a tota la pàgina, i sense internet l'aplicació es
         quedava sense estils. Es genera amb "npm run build:assets".
         tailwind.css va després dels CSS propis, com abans anava el del CDN,
         perquè a igual especificitat manin les mateixes regles. -->
    <link rel="stylesheet" href="vendor/inter/inter.css">
    <link rel="stylesheet" href="vendor/material-symbols/outlined.css">
    <link rel="stylesheet" href="css/tailwind.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <span class="material-symbols-outlined" style="font-size: 2rem; color: #4f46e5;">account_balance_wallet</span>
                <span class="sidebar-logo">Budget AI</span>
            </div>
            <nav class="nav-links flex-1 px-4 space-y-1">
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="dashboard">
                    <span class="material-symbols-outlined">dashboard</span>
                    <span class="font-medium text-sm">Dashboard</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" data-view="transactions"  href="#">
                    <span class="material-symbols-outlined">receipt_long</span>
                    <span class="font-medium text-sm" >Transacciones</span>
                </a>
<a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="categories">
                    <span class="material-symbols-outlined">label</span>
                    <span class="font-medium text-sm">Categorías</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="accounts">
                    <span class="material-symbols-outlined">account_balance_wallet</span>
                    <span class="font-medium text-sm">Cuentas</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="budgets">
                    <span class="material-symbols-outlined">pie_chart</span>
                    <span class="font-medium text-sm">Presupuestos</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="goals">
                    <span class="material-symbols-outlined">flag</span>
                    <span class="font-medium text-sm">Metas</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="transfers">
                    <span class="material-symbols-outlined">swap_horiz</span>
                    <span class="font-medium text-sm">Transferencias</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="recurring">
                    <span class="material-symbols-outlined">autorenew</span>
                    <span class="font-medium text-sm">Recurrentes</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600
                dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="analytics">
                    <span class="material-symbols-outlined">insights</span>
                    <span class="font-medium text-sm">Análisis</span>
                </a>
                <a class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors" href="#" data-view="settings">
                    <span class="material-symbols-outlined">settings</span>
                    <span class="font-medium text-sm">Configuración</span>
                </a>
            </nav>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar flex justify-between items-center px-6 py-4 bg-white border-b border-slate-200">
                <h2 class="page-title text-xl font-bold text-slate-800" id="page-title">Resum Financer</h2>

                <div class="flex items-center gap-4">
                    <button class="nav-link flex items-center gap-2 rounded-lg bg-primary py-2 px-4 text-white text-sm font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-all" data-view="upload">
                        <span class="material-symbols-outlined text-lg">upload_file</span>
                        <span>Importar CSV</span>
                    </button>

                    <div class="user-profile cursor-pointer">
                        <span class="material-symbols-outlined" style="font-size: 2rem; color: #6b7280;">account_circle</span>
                    </div>

                    <button id="logout-btn" title="Tancar sessió"
                            class="flex items-center gap-2 rounded-lg border border-slate-200 dark:border-slate-700 py-2 px-3 text-sm text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-lg">logout</span>
                        <span>Sortir</span>
                    </button>
                </div>
            </header>

            <div id="main-content" class="content-area p-6">
                <!-- Dynamic Content Loaded Here -->
                <div class="loading-spinner">Carregant...</div>
            </div>
        </main>
    </div>

    <!-- JS Modules -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
