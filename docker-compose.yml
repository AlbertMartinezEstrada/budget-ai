version: '3.8'

services:
  db:
    image: postgres:17
    container_name: budget_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_HOST_AUTH_METHOD: md5
    # Només des d'aquesta màquina (DBeaver, còpies de seguretat). Amb
    # "5432:5432" el port quedava obert a tota la xarxa, i qualsevol aparell
    # podia provar d'entrar a la base de dades saltant-se el login de l'app.
    # El backend no passa per aquí: dins de Docker hi arriba per db:5432.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-java/init.sql:/docker-entrypoint-initdb.d/init.sql
    # Dins del contenidor ha d'escoltar a totes les interfícies: el backend hi
    # arriba per la xarxa de Docker. Qui limita l'accés des de fora és el
    # "ports" de dalt, no això.
    command: postgres -c listen_addresses='*'

  backend:
    build: ./backend-java
    container_name: budget_api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:-}
      - JWT_SECRET=${JWT_SECRET}
      # Des d'on es pot obrir l'aplicació. Per entrar des del mòbil (Tailscale)
      # cal afegir-hi l'adreça del PC: veure ACCESO_DESDE_EL_MOVIL.md. Sense
      # passar-la aquí, posar-la al .env no feia res.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: budget_web
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  postgres_data: